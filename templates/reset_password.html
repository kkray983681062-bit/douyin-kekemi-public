{% extends "auth_base.html" %}
{% block title %}重置密码 · 克克咪{% endblock %}
{% block page_name %}reset{% endblock %}
{% block panel %}
  <div class="panel-heading">
    <span class="eyebrow">RESET PASSWORD</span>
    <h2>设置新密码</h2>
    <p>重置后，其他设备上的登录会话将失效</p>
  </div>

  <form id="resetForm" class="auth-form" novalidate>
    <label>
      <span>新密码</span>
      <input name="password" type="password" autocomplete="new-password" minlength="8" required placeholder="至少 8 位">
    </label>
    <label>
      <span>确认新密码</span>
      <input name="password_confirm" type="password" autocomplete="new-password" minlength="8" required placeholder="再次输入新密码">
    </label>
    <button class="primary-button" type="submit">保存新密码</button>
  </form>
  <div id="formMessage" class="form-message" role="status" aria-live="polite"></div>
  <div class="panel-links panel-links-single">
    <a href="/login">返回登录</a>
  </div>
{% endblock %}
